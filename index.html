<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>马可福音 · 50题圣经测验</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f7f3ee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
    }

    .quiz-container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.04);
      padding: 24px 20px 28px;
      transition: all 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 2px solid #efe9e1;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2a3e3a;
      letter-spacing: -0.5px;
    }

    .header .badge {
      background: #2a3e3a;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 40px;
      letter-spacing: 0.3px;
    }

    .progress-section {
      background: #f5f1eb;
      border-radius: 60px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-weight: 500;
      color: #2d4542;
      font-size: 0.95rem;
    }

    .progress-section .num {
      background: white;
      padding: 4px 14px;
      border-radius: 30px;
      font-weight: 600;
      color: #1a2f2c;
    }

    .question-card {
      background: #fcfaf7;
      border-radius: 24px;
      padding: 20px 18px;
      margin-bottom: 24px;
      min-height: 100px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
    }

    .question-card .q-text {
      font-size: 1.35rem;
      font-weight: 550;
      line-height: 1.5;
      color: #1e312e;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #f7f4ef;
      border: 2.5px solid #e4ddd3;
      border-radius: 60px;
      padding: 16px 20px;
      font-size: 1.05rem;
      font-weight: 450;
      color: #1f3330;
      text-align: left;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.3;
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:active {
      transform: scale(0.97);
      background: #ede8df;
    }

    .option-btn .prefix {
      font-weight: 700;
      color: #6e7e76;
      width: 30px;
      flex-shrink: 0;
    }

    .option-btn.selected {
      border-color: #3d615a;
      background: #e6eee9;
      box-shadow: 0 0 0 3px #3d615a40;
    }

    .option-btn.correct {
      border-color: #1f7a4a;
      background: #def0e4;
      box-shadow: 0 0 0 3px #1f7a4a40;
    }

    .option-btn.wrong {
      border-color: #b13e3e;
      background: #f3e0e0;
      box-shadow: 0 0 0 3px #b13e3e40;
    }

    .option-btn.disabled {
      pointer-events: none;
      opacity: 0.85;
    }

    .action-row {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      border: none;
      padding: 15px 18px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.12s ease;
      flex: 1;
      text-align: center;
      letter-spacing: 0.3px;
      border: 2px solid transparent;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: #2a4e47;
      color: white;
      border-color: #1d3a35;
      box-shadow: 0 4px 12px rgba(42, 78, 71, 0.15);
    }

    .btn-primary:active {
      background: #1d3a35;
    }

    .btn-secondary {
      background: #e8e2d9;
      border-color: #d5cdc1;
      color: #2d3d39;
    }

    .btn-secondary:active {
      background: #d9d0c4;
    }

    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .score-area {
      margin-top: 22px;
      background: #f4f0ea;
      border-radius: 40px;
      padding: 16px 14px;
      text-align: center;
      border: 1px solid #e3dbd1;
    }

    .score-area .big {
      font-size: 2.2rem;
      font-weight: 700;
      color: #1f443e;
      letter-spacing: -0.5px;
    }

    .score-area .label {
      font-weight: 500;
      color: #405b56;
      margin-right: 6px;
    }

    .footer-tip {
      margin-top: 14px;
      font-size: 0.75rem;
      text-align: center;
      color: #a89f92;
      letter-spacing: 0.2px;
    }

    @media (max-width: 420px) {
      .quiz-container { padding: 18px 14px; }
      .question-card .q-text { font-size: 1.2rem; }
      .option-btn { padding: 14px 16px; font-size: 0.98rem; }
      .header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<div class="quiz-container" id="app">
  <div class="header">
    <h1>📖 马可福音</h1>
    <span class="badge">50 题</span>
  </div>

  <div class="progress-section">
    <span>📌 <span id="currentNum">1</span> / 50</span>
    <span class="num" id="progressPercent">0%</span>
  </div>

  <div class="question-card">
    <div class="q-text" id="questionText">加载题目中...</div>
  </div>

  <div class="options-grid" id="optionsContainer"></div>

  <div class="action-row">
    <button class="btn btn-secondary" id="resetBtn">⟲ 重来</button>
    <button class="btn btn-primary" id="nextBtn">下一题 →</button>
  </div>

  <div class="score-area">
    <span class="label">✅ 得分</span>
    <span class="big" id="scoreDisplay">0</span>
    <span class="label">/ 50</span>
  </div>
  <div class="footer-tip">点选答案即锁定 · 全部答完显示最终得分</div>
</div>

<script>
  (function() {
    // ==================== 马可福音 50 题 ====================
    const QUESTIONS = [
      { q: "马可福音中，耶稣被称为“神的儿子”是在哪一章？", options: ["第1章", "第5章", "第15章"], answer: 0 },
      { q: "施洗约翰在旷野传讲的中心信息是什么？", options: ["悔改的洗礼", "律法的精义", "天国的奥秘"], answer: 0 },
      { q: "耶稣在加利利海边呼召的第一对兄弟是谁？", options: ["彼得和安得烈", "雅各和约翰", "腓力和巴多罗买"], answer: 0 },
      { q: "耶稣医治那个被鬼附的人时，鬼的名字叫什么？", options: ["群", "别西卜", "撒但"], answer: 0 },
      { q: "马可福音中，耶稣平静风和海的事件发生在哪一地区？", options: ["加利利海", "约旦河", "革尼撒勒湖"], answer: 0 },
      { q: "睚鲁的女儿被耶稣复活时，她多大年纪？", options: ["12岁", "8岁", "20岁"], answer: 0 },
      { q: "耶稣差遣十二门徒出去传道时，嘱咐他们带什么？", options: ["拐杖和鞋", "口袋和食物", "两件褂子"], answer: 0 },
      { q: "希律王认为耶稣是复活的谁？", options: ["施洗约翰", "以利亚", "先知中的一位"], answer: 0 },
      { q: "五饼二鱼的神迹中，有多少人吃饱？", options: ["五千", "四千", "一万"], answer: 0 },
      { q: "耶稣在水面上行走是在哪一段海域？", options: ["加利利海", "地中海", "死海"], answer: 0 },
      { q: "耶稣说“从人里面出来的，那才能污秽人”记载在哪一章？", options: ["第7章", "第10章", "第12章"], answer: 0 },
      { q: "迦南妇人求耶稣医治她的女儿，耶稣最初怎么回应？", options: ["拒绝", "立刻医治", "称赞她的信心"], answer: 0 },
      { q: "耶稣在凯撒利亚·腓立比问门徒：“人说我是谁？”谁回答“你是基督”？", options: ["彼得", "约翰", "雅各"], answer: 0 },
      { q: "耶稣登山变像时，有哪两位旧约人物显现？", options: ["以利亚和摩西", "亚伯拉罕和大卫", "以赛亚和耶利米"], answer: 0 },
      { q: "耶稣为小孩子祝福时，门徒的态度如何？", options: ["责备他们", "欢迎他们", "忽略他们"], answer: 0 },
      { q: "富有的少年官问耶稣如何承受永生，耶稣要他做什么？", options: ["变卖所有分给穷人", "遵守诫命", "跟从他"], answer: 0 },
      { q: "耶稣在耶利哥医治的盲人名叫什么？", options: ["巴底买", "巴拿巴", "巴多罗买"], answer: 0 },
      { q: "耶稣荣入圣城时，骑的是什么？", options: ["驴驹", "马", "骡子"], answer: 0 },
      { q: "耶稣洁净圣殿时，推倒了什么？", options: ["兑换银钱之人的桌子", "祭司的座位", "祭坛"], answer: 0 },
      { q: "无花果树被耶稣咒诅后，门徒看见它怎样了？", options: ["枯干了", "连根拔起", "叶子掉光"], answer: 0 },
      { q: "祭司长和文士想用什么计谋捉拿耶稣？", options: ["诡计", "武力", "法律"], answer: 0 },
      { q: "马可福音中，哪一位妇女用香膏膏耶稣？", options: ["伯大尼的马利亚", "抹大拉的马利亚", "撒玛利亚妇人"], answer: 0 },
      { q: "最后的晚餐中，耶稣说“这是我的身体”指的是什么？", options: ["饼", "杯", "酒"], answer: 0 },
      { q: "耶稣在客西马尼园祷告时，门徒怎么了？", options: ["睡着了", "祷告", "逃跑"], answer: 0 },
      { q: "犹大用什么暗号出卖耶稣？", options: ["亲嘴", "握手", "眼神"], answer: 0 },
      { q: "耶稣被带到大祭司该亚法面前，谁否认了耶稣？", options: ["彼得", "犹大", "约翰"], answer: 0 },
      { q: "巡抚彼拉多问耶稣：“你是犹太人的王吗？”耶稣如何回答？", options: ["你说的是", "不是", "沉默"], answer: 0 },
      { q: "耶稣被钉十字架时，上面写的罪名是什么？", options: ["犹太人的王", "犹太人的救主", "以马内利"], answer: 0 },
      { q: "耶稣在十字架上说的“以罗伊，以罗伊！拉马撒巴各大尼？”是什么意思？", options: ["我的神，为什么离弃我", "父啊，赦免他们", "成了"], answer: 0 },
      { q: "耶稣断气时，圣殿的幔子怎样？", options: ["裂为两半", "烧毁", "倒塌"], answer: 0 },
      { q: "抹大拉的马利亚和雅各的母亲马利亚买了什么要去膏耶稣的身体？", options: ["香膏", "没药", "香料"], answer: 0 },
      { q: "耶稣复活后首先向谁显现？", options: ["抹大拉的马利亚", "彼得", "众门徒"], answer: 0 },
      { q: "耶稣复活后，门徒中有谁不相信？", options: ["多马", "腓力", "马太"], answer: 0 },
      { q: "耶稣升天前吩咐门徒往普天下去做什么？", options: ["传福音给万民", "医病赶鬼", "建立教会"], answer: 0 },
      { q: "马可福音的作者是谁？", options: ["马可", "彼得", "路加"], answer: 0 },
      { q: "马可福音中，耶稣受洗时，天上有声音说“你是我的爱子，我喜悦你”发生在哪一章？", options: ["第1章", "第3章", "第9章"], answer: 0 },
      { q: "耶稣在旷野受试探多久？", options: ["四十天", "七天", "三天"], answer: 0 },
      { q: "耶稣医治彼得的岳母时，她患了什么病？", options: ["热病", "瘫痪", "血漏"], answer: 0 },
      { q: "耶稣对瘫子说“你的罪赦了”，文士心里议论什么？", options: ["他说僭妄的话", "他行神迹", "他讲道有权柄"], answer: 0 },
      { q: "利未（马太）是做什么的？", options: ["税吏", "渔夫", "医生"], answer: 0 },
      { q: "耶稣说“新酒装在新皮袋里”比喻什么？", options: ["新旧约的更新", "禁食和宴乐", "律法和恩典"], answer: 0 },
      { q: "耶稣在安息日治好枯干一只手的人，法利赛人反应如何？", options: ["商议除灭他", "归荣耀给神", "信了他"], answer: 0 },
      { q: "耶稣的亲属来找他，认为他怎么了？", options: ["癫狂了", "生病了", "被鬼附"], answer: 0 },
      { q: "耶稣用比喻讲道，为什么对众人用比喻？", options: ["叫他们看是看见却不晓得", "让他们容易记忆", "隐藏天国的奥秘"], answer: 0 },
      { q: "撒种的比喻中，种子落在路旁被什么吃掉了？", options: ["飞鸟", "野狗", "虫子"], answer: 0 },
      { q: "耶稣在格拉森赶出群鬼后，当地人请求耶稣做什么？", options: ["离开他们的境界", "留下医治", "传道给他们"], answer: 0 },
      { q: "患血漏的妇人摸耶稣衣裳，耶稣感觉什么？", options: ["有能力从身上出去", "被人拥挤", "愤怒"], answer: 0 },
      { q: "耶稣使拉撒路复活记载在哪卷福音书？", options: ["约翰福音", "马可福音", "路加福音"], answer: 0 },
      { q: "马可福音的结尾，最短的古卷结束于第几章第几节？", options: ["16章8节", "16章20节", "15章47节"], answer: 0 },
      { q: "马可福音中，耶稣称赞穷寡妇投了两个小钱，她说她投入什么？", options: ["一切养生的", "十分之一", "全部积蓄"], answer: 0 }
    ];

    // ==================== 核心状态 ====================
    let currentIndex = 0;
    let score = 0;
    let userAnswers = new Array(50).fill(null);
    let quizCompleted = false;

    // DOM 引用
    const questionEl = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const currentNumEl = document.getElementById('currentNum');
    const progressPercent = document.getElementById('progressPercent');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ==================== 渲染函数 ====================
    function updateProgress() {
      const answered = userAnswers.filter(a => a !== null).length;
      const pct = Math.round((answered / 50) * 100);
      progressPercent.textContent = pct + '%';
      currentNumEl.textContent = currentIndex + 1;

      // 计算得分
      const correct = userAnswers.reduce((acc, ans, idx) => {
        if (ans === null) return acc;
        return acc + (ans === QUESTIONS[idx].answer ? 1 : 0);
      }, 0);
      score = correct;
      scoreDisplay.textContent = score;

      if (answered === 50 && !quizCompleted) {
        quizCompleted = true;
        nextBtn.textContent = '🎉 已完成';
      }
    }

    function renderQuestion() {
      const qData = QUESTIONS[currentIndex];
      if (!qData) return;

      questionEl.textContent = qData.q;

      const selected = userAnswers[currentIndex];
      const isAnswered = (selected !== null);
      const correctIdx = qData.answer;
      const labels = ['A', 'B', 'C'];

      let html = '';
      qData.options.forEach((opt, idx) => {
        let cls = 'option-btn';
        if (isAnswered) {
          cls += ' disabled';
          if (idx === selected) {
            cls += ' selected';
            cls += (selected === correctIdx) ? ' correct' : ' wrong';
          } else if (idx === correctIdx && selected !== correctIdx) {
            cls += ' correct';
          }
        }
        html += `<button class="${cls}" data-opt="${idx}">
          <span class="prefix">${labels[idx]}.</span> ${opt}
        </button>`;
      });

      optionsContainer.innerHTML = html;

      // 绑定事件（仅当未回答）
      if (!isAnswered) {
        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.addEventListener('click', handleOptionClick);
        });
      }

      updateProgress();

      // 下一题按钮文案
      if (currentIndex === 49 && userAnswers.every(a => a !== null)) {
        nextBtn.textContent = '🏁 完成';
      } else if (currentIndex === 49) {
        nextBtn.textContent = '🏁 完成';
      } else {
        nextBtn.textContent = '下一题 →';
      }

      if (quizCompleted) {
        nextBtn.textContent = '🎉 已完成';
      }
    }

    // ==================== 选项点击 ====================
    function handleOptionClick(e) {
      const btn = e.currentTarget;
      const optIdx = parseInt(btn.dataset.opt, 10);
      if (userAnswers[currentIndex] !== null || quizCompleted) return;

      userAnswers[currentIndex] = optIdx;
      renderQuestion();

      // 检查是否全部完成
      if (userAnswers.every(a => a !== null)) {
        quizCompleted = true;
        updateProgress();
        nextBtn.textContent = '🎉 已完成';
        const correct = userAnswers.reduce((acc, ans, idx) => {
          return acc + (ans === QUESTIONS[idx].answer ? 1 : 0);
        }, 0);
        score = correct;
        scoreDisplay.textContent = score;
      }
    }

    // ==================== 下一题 ====================
    function goToNext() {
      if (quizCompleted) return;

      // 若当前未答，闪烁提醒
      if (userAnswers[currentIndex] === null) {
        const card = document.querySelector('.question-card');
        card.style.transition = 'background 0.15s';
        card.style.background = '#f7e6e6';
        setTimeout(() => { card.style.background = '#fcfaf7'; }, 250);
        return;
      }

      if (currentIndex < 49) {
        currentIndex++;
        renderQuestion();
      } else {
        // 第50题，检查是否全部答完
        if (userAnswers.every(a => a !== null)) {
          quizCompleted = true;
          updateProgress();
          nextBtn.textContent = '🎉 已完成';
          renderQuestion();
        } else {
          const card = document.querySelector('.question-card');
          card.style.transition = 'background 0.15s';
          card.style.background = '#f7e6e6';
          setTimeout(() => { card.style.background = '#fcfaf7'; }, 250);
        }
      }
    }

    // ==================== 重置 ====================
    function resetQuiz() {
      currentIndex = 0;
      userAnswers = new Array(50).fill(null);
      quizCompleted = false;
      score = 0;
      scoreDisplay.textContent = '0';
      nextBtn.textContent = '下一题 →';
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ==================== 初始化 ====================
    function init() {
      renderQuestion();
      nextBtn.addEventListener('click', goToNext);
      resetBtn.addEventListener('click', resetQuiz);
    }

    init();
  })();
</script>
</body>
</html>
